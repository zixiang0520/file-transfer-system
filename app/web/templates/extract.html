<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>提取文件 - 文件流转系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    input, select, textarea, button { font-size: 16px; }
    .tap { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen min-h-[100dvh]">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 sm:py-8">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-6 sm:mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold">提取文件</h1>
        <p class="text-zinc-400 text-sm mt-1">输入提取码查看并下载</p>
      </div>
      <a href="/" class="tap inline-flex items-center justify-center min-h-[44px] px-4 py-2 bg-zinc-900 active:bg-zinc-800 rounded-xl text-sm w-full sm:w-auto">
        <i class="fa-solid fa-upload mr-2"></i> 去上传
      </a>
    </header>

    <div class="bg-zinc-900 rounded-2xl sm:rounded-3xl p-4 sm:p-6 mb-5 sm:mb-6">
      <label class="text-sm text-zinc-400" for="codeInput">提取码</label>
      <div class="flex flex-col sm:flex-row gap-3 mt-2">
        <input id="codeInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters"
               placeholder="例如 A3K9M2"
               class="w-full flex-1 min-h-[48px] bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 tracking-widest uppercase font-mono text-lg outline-none focus:border-violet-500" />
        <button type="button" onclick="lookup()"
                class="tap w-full sm:w-auto min-h-[48px] px-6 py-3 bg-violet-600 active:bg-violet-500 rounded-2xl font-medium shrink-0">
          查询
        </button>
      </div>
      <p id="err" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>

    <div id="panel" class="hidden bg-zinc-900 rounded-2xl sm:rounded-3xl p-4 sm:p-6">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4 mb-5 sm:mb-6 text-sm">
        <div class="col-span-2 sm:col-span-1">
          <span class="text-zinc-400 text-xs">提取码</span>
          <div id="pCode" class="font-mono text-xl sm:text-2xl font-bold tracking-widest break-all"></div>
        </div>
        <div><span class="text-zinc-400 text-xs">文件数</span><div id="pCount" class="text-base sm:text-lg"></div></div>
        <div><span class="text-zinc-400 text-xs">总大小</span><div id="pSize" class="text-base sm:text-lg"></div></div>
        <div class="col-span-2 sm:col-span-1"><span class="text-zinc-400 text-xs">过期时间</span><div id="pExp" class="text-sm sm:text-lg break-all"></div></div>
        <div><span class="text-zinc-400 text-xs">剩余提取</span><div id="pRemain" class="text-base sm:text-lg"></div></div>
      </div>

      <!-- 操作条：手机纵向全宽 -->
      <div class="flex flex-col sm:flex-row sm:flex-wrap gap-2 sm:gap-3 mb-4">
        <label class="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer select-none min-h-[44px]">
          <input id="chkAll" type="checkbox" class="w-5 h-5 rounded accent-violet-500" onchange="toggleAll(this.checked)" />
          全选
        </label>
        <button type="button" onclick="downloadSelected()"
                class="tap w-full sm:w-auto min-h-[44px] px-4 py-2.5 bg-violet-600 active:bg-violet-500 rounded-xl text-sm">
          <i class="fa-solid fa-download mr-1"></i> 下载已选择
        </button>
        <button type="button" onclick="downloadAll()"
                class="tap w-full sm:w-auto min-h-[44px] px-4 py-2.5 bg-fuchsia-600 active:bg-fuchsia-500 rounded-xl text-sm">
          <i class="fa-solid fa-file-zipper mr-1"></i> 全部 ZIP
        </button>
        <span id="selHint" class="text-xs text-zinc-500 self-center">已选 0 个</span>
      </div>

      <div id="fileList" class="space-y-2"></div>
    </div>
  </div>
  <script>
    function fmtSize(n) {
      n = Number(n)||0;
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
      return (n/1073741824).toFixed(2) + ' GB';
    }
    function fmtTime(ts) {
      try { return new Date(ts*1000).toLocaleString(); } catch(e){ return '-'; }
    }
    let currentCode = '';

    function selectedIds() {
      return Array.from(document.querySelectorAll('.file-chk:checked')).map(el => el.value);
    }
    function updateSelHint() {
      const n = selectedIds().length;
      document.getElementById('selHint').textContent = '已选 ' + n + ' 个';
      const boxes = document.querySelectorAll('.file-chk');
      const all = document.getElementById('chkAll');
      if (all && boxes.length) {
        all.checked = n === boxes.length;
        all.indeterminate = n > 0 && n < boxes.length;
      }
    }
    function toggleAll(on) {
      document.querySelectorAll('.file-chk').forEach(el => { el.checked = on; });
      updateSelHint();
    }

    async function lookup() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const err = document.getElementById('err');
      err.classList.add('hidden');
      if (!code) { err.textContent='请输入提取码'; err.classList.remove('hidden'); return; }
      const r = await fetch('/api/package/' + encodeURIComponent(code));
      const data = await r.json();
      if (!r.ok || data.error) {
        err.textContent = data.error || '查询失败';
        err.classList.remove('hidden');
        document.getElementById('panel').classList.add('hidden');
        return;
      }
      currentCode = data.extract_code;
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('pCode').textContent = data.extract_code;
      document.getElementById('pCount').textContent = data.file_count + ' 个';
      document.getElementById('pSize').textContent = fmtSize(data.total_size);
      document.getElementById('pExp').textContent = fmtTime(data.expire_at);
      const rem = data.remaining_extracts;
      const maxE = data.max_extracts || 0;
      document.getElementById('pRemain').textContent = maxE > 0 ? `${rem} / ${maxE}` : '不限';
      const box = document.getElementById('fileList');
      box.innerHTML = '';
      document.getElementById('chkAll').checked = false;
      document.getElementById('chkAll').indeterminate = false;
      (data.files||[]).forEach(f => {
        const row = document.createElement('div');
        row.className = 'flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 bg-zinc-800/80 rounded-2xl px-3 sm:px-4 py-3';
        row.innerHTML = `
          <label class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer">
            <input type="checkbox" class="file-chk w-5 h-5 rounded accent-violet-500 shrink-0" value="${f.id}" onchange="updateSelHint()" />
            <div class="min-w-0">
              <div class="font-medium text-sm sm:text-base break-all sm:truncate">${f.name}</div>
              <div class="text-xs text-zinc-500">${fmtSize(f.size)}</div>
            </div>
          </label>
          <a class="tap inline-flex items-center justify-center min-h-[44px] px-4 py-2 bg-violet-600 active:bg-violet-500 rounded-xl text-sm w-full sm:w-auto shrink-0"
             href="/api/download/${encodeURIComponent(data.extract_code)}/${f.id}">
            <i class="fa-solid fa-download mr-1"></i> 下载
          </a>`;
        box.appendChild(row);
      });
      updateSelHint();
    }
    function downloadAll() {
      if (!currentCode) return;
      window.location.href = '/api/download-all/' + encodeURIComponent(currentCode);
    }
    function downloadSelected() {
      if (!currentCode) return;
      const ids = selectedIds();
      if (!ids.length) { alert('请先勾选要下载的文件'); return; }
      if (ids.length === 1) {
        window.location.href = '/api/download/' + encodeURIComponent(currentCode) + '/' + ids[0];
        return;
      }
      window.location.href = '/api/download-selected/' + encodeURIComponent(currentCode)
        + '?ids=' + encodeURIComponent(ids.join(','));
    }
    const q = new URLSearchParams(location.search).get('code');
    if (q) { document.getElementById('codeInput').value = q; lookup(); }
    document.getElementById('codeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookup();
    });
  </script>
</body>
</html>
