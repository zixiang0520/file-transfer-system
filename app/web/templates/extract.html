<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>提取文件 - 文件流转系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold">提取文件</h1>
        <p class="text-zinc-400 text-sm mt-1">输入提取码查看并下载文件</p>
      </div>
      <a href="/" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 rounded-xl text-sm">
        <i class="fa-solid fa-upload mr-1"></i> 去上传
      </a>
    </div>

    <div class="bg-zinc-900 rounded-3xl p-6 mb-6">
      <label class="text-sm text-zinc-400">提取码</label>
      <div class="flex gap-3 mt-2">
        <input id="codeInput" type="text" placeholder="例如 A3K9M2"
               class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 tracking-widest uppercase font-mono text-lg outline-none focus:border-violet-500"
               maxlength="12" />
        <button onclick="lookup()" class="px-6 py-3 bg-violet-600 hover:bg-violet-500 rounded-2xl font-medium">
          查询
        </button>
      </div>
      <p id="err" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>

    <div id="panel" class="hidden bg-zinc-900 rounded-3xl p-6">
      <div class="flex flex-wrap gap-6 mb-6 text-sm">
        <div><span class="text-zinc-400">提取码</span><div id="pCode" class="font-mono text-2xl font-bold tracking-widest"></div></div>
        <div><span class="text-zinc-400">文件数</span><div id="pCount" class="text-lg"></div></div>
        <div><span class="text-zinc-400">总大小</span><div id="pSize" class="text-lg"></div></div>
        <div><span class="text-zinc-400">过期时间</span><div id="pExp" class="text-lg"></div></div>
        <div><span class="text-zinc-400">剩余提取</span><div id="pRemain" class="text-lg"></div></div>
      </div>

      <div class="flex flex-wrap items-center gap-3 mb-4">
        <label class="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer select-none">
          <input id="chkAll" type="checkbox" class="w-4 h-4 rounded accent-violet-500" onchange="toggleAll(this.checked)" />
          全选
        </label>
        <button onclick="downloadSelected()" class="px-4 py-2 bg-violet-600 hover:bg-violet-500 rounded-xl text-sm">
          <i class="fa-solid fa-download mr-1"></i> 下载已选择的文件
        </button>
        <button onclick="downloadAll()" class="px-4 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 rounded-xl text-sm">
          <i class="fa-solid fa-file-zipper mr-1"></i> 全部下载 (ZIP)
        </button>
        <span id="selHint" class="text-xs text-zinc-500">已选 0 个</span>
      </div>

      <div id="fileList" class="space-y-2"></div>
    </div>
  </div>
  <script>
    function fmtSize(n) {
      n = Number(n)||0;
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
      return (n/1073741824).toFixed(2) + ' GB';
    }
    function fmtTime(ts) {
      try { return new Date(ts*1000).toLocaleString(); } catch(e){ return '-'; }
    }
    let currentCode = '';

    function selectedIds() {
      return Array.from(document.querySelectorAll('.file-chk:checked')).map(el => el.value);
    }
    function updateSelHint() {
      const n = selectedIds().length;
      document.getElementById('selHint').textContent = '已选 ' + n + ' 个';
      const boxes = document.querySelectorAll('.file-chk');
      const all = document.getElementById('chkAll');
      if (all && boxes.length) {
        all.checked = n === boxes.length;
        all.indeterminate = n > 0 && n < boxes.length;
      }
    }
    function toggleAll(on) {
      document.querySelectorAll('.file-chk').forEach(el => { el.checked = on; });
      updateSelHint();
    }

    async function lookup() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const err = document.getElementById('err');
      err.classList.add('hidden');
      if (!code) { err.textContent='请输入提取码'; err.classList.remove('hidden'); return; }
      const r = await fetch('/api/package/' + encodeURIComponent(code));
      const data = await r.json();
      if (!r.ok || data.error) {
        err.textContent = data.error || '查询失败';
        err.classList.remove('hidden');
        document.getElementById('panel').classList.add('hidden');
        return;
      }
      currentCode = data.extract_code;
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('pCode').textContent = data.extract_code;
      document.getElementById('pCount').textContent = data.file_count + ' 个';
      document.getElementById('pSize').textContent = fmtSize(data.total_size);
      document.getElementById('pExp').textContent = fmtTime(data.expire_at);
      const rem = data.remaining_extracts;
      const maxE = data.max_extracts || 0;
      document.getElementById('pRemain').textContent =
        maxE > 0 ? `${rem} / ${maxE}` : '不限';
      const box = document.getElementById('fileList');
      box.innerHTML = '';
      document.getElementById('chkAll').checked = false;
      document.getElementById('chkAll').indeterminate = false;
      (data.files||[]).forEach(f => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-3 bg-zinc-800/80 rounded-2xl px-4 py-3';
        row.innerHTML = `
          <label class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer">
            <input type="checkbox" class="file-chk w-4 h-4 rounded accent-violet-500 shrink-0" value="${f.id}" onchange="updateSelHint()" />
            <div class="min-w-0">
              <div class="font-medium truncate">${f.name}</div>
              <div class="text-xs text-zinc-500">${fmtSize(f.size)}</div>
            </div>
          </label>
          <a class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 rounded-xl text-sm shrink-0"
             href="/api/download/${encodeURIComponent(data.extract_code)}/${f.id}">
            <i class="fa-solid fa-download"></i> 下载
          </a>`;
        box.appendChild(row);
      });
      updateSelHint();
    }
    function downloadAll() {
      if (!currentCode) return;
      window.location.href = '/api/download-all/' + encodeURIComponent(currentCode);
    }
    function downloadSelected() {
      if (!currentCode) return;
      const ids = selectedIds();
      if (!ids.length) {
        alert('请先勾选要下载的文件');
        return;
      }
      // 只选 1 个时直接单文件下载；多个打成 ZIP
      if (ids.length === 1) {
        window.location.href = '/api/download/' + encodeURIComponent(currentCode) + '/' + ids[0];
        return;
      }
      window.location.href = '/api/download-selected/' + encodeURIComponent(currentCode)
        + '?ids=' + encodeURIComponent(ids.join(','));
    }
    const q = new URLSearchParams(location.search).get('code');
    if (q) { document.getElementById('codeInput').value = q; lookup(); }
    document.getElementById('codeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookup();
    });
  </script>
</body>
</html>
