<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>文件流转系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
    :root { color-scheme: dark; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 0);
      padding-left: env(safe-area-inset-left, 0);
      padding-right: env(safe-area-inset-right, 0);
    }
    /* 防止 iOS 输入框聚焦放大 */
    input, select, textarea, button { font-size: 16px; }
    .dropzone { transition: border-color .2s, background .2s, transform .15s; }
    .dropzone.dragover { background: rgba(139,92,246,.12); border-color: #a855f7; }
    .file-item { transition: background .15s; }
    .tap { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .safe-pad { padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right)); }
    @media (max-width: 640px) {
      .code-display { font-size: 1.75rem; letter-spacing: 0.2em; word-break: break-all; }
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen min-h-[100dvh]">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 sm:py-8 safe-pad">
    <!-- Header：手机纵向堆叠 -->
    <header class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-6 sm:mb-8">
      <div class="min-w-0">
        <h1 class="text-2xl sm:text-4xl font-bold tracking-tight">文件流转</h1>
        <p class="text-zinc-400 text-sm sm:text-base mt-1">上传文件 → 获提取码 → 分享下载</p>
      </div>
      <nav class="flex gap-2 w-full sm:w-auto">
        <a href="/extract" class="tap flex-1 sm:flex-none justify-center px-3 sm:px-4 py-2.5 min-h-[44px] bg-zinc-900 hover:bg-zinc-800 active:bg-zinc-700 rounded-xl flex items-center gap-2 text-sm">
          <i class="fa-solid fa-list"></i><span>提取</span>
        </a>
        <a href="/admin" class="tap flex-1 sm:flex-none justify-center px-3 sm:px-4 py-2.5 min-h-[44px] bg-violet-600 hover:bg-violet-500 active:bg-violet-400 rounded-xl flex items-center gap-2 text-sm">
          <i class="fa-solid fa-cog"></i><span>后台</span>
        </a>
      </nav>
    </header>

    <!-- Upload Zone -->
    <div id="uploadZone" class="dropzone border-2 border-dashed border-zinc-700 rounded-2xl sm:rounded-3xl p-8 sm:p-12 text-center cursor-pointer hover:border-violet-500 active:border-violet-400">
      <div class="flex flex-col items-center gap-3 sm:gap-4">
        <i class="fa-solid fa-cloud-arrow-up text-4xl sm:text-6xl text-violet-500"></i>
        <div>
          <p class="text-lg sm:text-2xl font-medium">拖拽文件到这里</p>
          <p class="text-zinc-400 text-sm sm:text-base mt-1">或点击选择，支持多文件 · 手机可直接相册/文件</p>
        </div>
        <input type="file" id="fileInput" multiple class="hidden" onchange="handleFiles(this.files)" />
        <button type="button" onclick="document.getElementById('fileInput').click()"
                class="tap w-full sm:w-auto min-h-[48px] px-8 py-3 bg-violet-600 hover:bg-violet-500 active:bg-violet-400 rounded-2xl font-medium">
          选择文件
        </button>
      </div>
    </div>

    <!-- File List -->
    <div id="fileList" class="hidden mt-6 sm:mt-8">
      <div class="flex justify-between items-center mb-3 sm:mb-4">
        <h3 class="font-medium text-base sm:text-lg">已添加文件</h3>
        <button type="button" onclick="clearAll()" class="tap text-red-400 active:text-red-300 text-sm min-h-[44px] px-2 flex items-center gap-1">
          <i class="fa-solid fa-trash"></i> 清空
        </button>
      </div>
      <div id="fileTable" class="space-y-2 sm:space-y-3"></div>
    </div>

    <!-- Options + Upload -->
    <div id="uploadButton" class="hidden mt-5 sm:mt-6 space-y-4">
      <div class="bg-zinc-900 rounded-2xl sm:rounded-3xl p-4 sm:p-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-sm text-zinc-400 mb-2 block">有效期</label>
            <div class="flex gap-2">
              <input id="expireValue" type="number" inputmode="numeric" min="1" max="999" value="3"
                     class="w-24 sm:w-28 min-h-[48px] bg-zinc-800 border border-zinc-700 rounded-2xl px-3 sm:px-4 py-3 outline-none focus:border-violet-500" />
              <select id="expireUnit"
                      class="flex-1 min-h-[48px] bg-zinc-800 border border-zinc-700 rounded-2xl px-3 sm:px-4 py-3 outline-none focus:border-violet-500">
                <option value="hour">小时</option>
                <option value="day" selected>天</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-sm text-zinc-400 mb-2 block">提取次数</label>
            <div class="flex gap-2 items-center">
              <input id="maxExtracts" type="number" inputmode="numeric" min="0" max="100000" value="0"
                     class="w-24 sm:w-28 min-h-[48px] bg-zinc-800 border border-zinc-700 rounded-2xl px-3 sm:px-4 py-3 outline-none focus:border-violet-500" />
              <span class="text-xs text-zinc-500 leading-snug">次<br class="sm:hidden" />（0=不限）</span>
            </div>
          </div>
        </div>
        <p class="text-xs text-zinc-500 mt-3 sm:mt-4 leading-relaxed">
          到达提取次数后文件自动销毁；有效期最长 <span id="maxExpireHint">{{ max_expire_days | default(90) }}</span> 天。
        </p>
      </div>
      <button type="button" id="btnUpload" onclick="uploadFiles()"
              class="tap w-full min-h-[52px] py-3.5 sm:py-4 bg-gradient-to-r from-violet-600 to-fuchsia-500 rounded-2xl sm:rounded-3xl font-semibold text-base sm:text-lg flex items-center justify-center gap-3 active:opacity-90">
        <i class="fa-solid fa-upload"></i>
        立即上传（生成提取码）
      </button>
      <div id="progressWrap" class="hidden bg-zinc-900 rounded-2xl sm:rounded-3xl p-4 sm:p-5 space-y-3">
        <div class="flex items-center justify-between gap-3 text-sm">
          <span id="progressLabel" class="text-zinc-300">准备上传…</span>
          <span id="progressPct" class="font-mono text-violet-300 tabular-nums">0%</span>
        </div>
        <div class="h-3 bg-zinc-800 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full w-0 bg-gradient-to-r from-violet-600 to-fuchsia-500 rounded-full transition-[width] duration-150"></div>
        </div>
        <div class="flex flex-wrap justify-between gap-2 text-xs text-zinc-500">
          <span id="progressBytes">0 / 0</span>
          <span id="progressSpeed"></span>
        </div>
      </div>
    </div>

    <!-- Result -->
    <div id="resultPanel" class="hidden mt-6 sm:mt-8 bg-zinc-900 rounded-2xl sm:rounded-3xl p-5 sm:p-8">
      <div class="flex items-start justify-between gap-3 mb-5 sm:mb-6">
        <div class="min-w-0">
          <div class="text-sm text-violet-400">提取码</div>
          <div id="extractCode" class="code-display text-3xl sm:text-5xl font-mono font-bold tracking-[0.15em] sm:tracking-[4px] text-white break-all"></div>
        </div>
        <button type="button" onclick="copyCode()" class="tap shrink-0 min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl bg-zinc-800 active:bg-zinc-700 text-violet-300">
          <i class="fa-solid fa-copy text-xl"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 xs:grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6 text-sm sm:text-base">
        <div>
          <div class="text-sm text-zinc-400 mb-1">过期时间</div>
          <div id="expireTime" class="font-medium"></div>
        </div>
        <div>
          <div class="text-sm text-zinc-400 mb-1">文件数量</div>
          <div id="fileCount" class="font-medium"></div>
        </div>
        <div class="sm:col-span-1">
          <div class="text-sm text-zinc-400 mb-1">提取次数</div>
          <div id="extractLimit" class="font-medium"></div>
        </div>
      </div>

      <button type="button" onclick="window.location.reload()"
              class="tap mt-6 sm:mt-8 w-full min-h-[48px] py-3 text-sm border border-zinc-700 active:bg-zinc-800 rounded-2xl">
        继续上传新文件
      </button>
    </div>
  </div>

    <!-- Footer -->
    <footer class="mt-10 sm:mt-12 pb-2 text-center">
      <a href="https://github.com/zixiang0520/file-transfer-system" target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-2 text-zinc-500 hover:text-violet-400 transition-colors text-xs sm:text-sm"
         aria-label="项目开源在 GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span>文件流转系统 · 开源在 GitHub</span>
      </a>
    </footer>
  </div>

  <script>
    let selectedFiles = [];

    // --- 内容锁定缓存：sha 计算时把文件内容读入内存，上传分片用同一份数据，
    // --- 避免文件在两次读取之间被其他程序修改导致"摘要值不匹配"---
    const shaCache = new Map(); // key: name|size -> ArrayBuffer
    let shaCacheBytes = 0;
    const SHA_CACHE_LIMIT = 1024 * 1024 * 1024; // 最多缓存 1GB

    // --- 纯 JS SHA-256（HTTP 环境无 crypto.subtle，故自实现）---
    function sha256Hex(blob, idx) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error || new Error('读取文件失败'));
        reader.onload = () => {
          try {
            const buf = reader.result;
            // 内容锁定：缓存本次读取的 ArrayBuffer（有上限，超出退化为不缓存）
            if (idx != null && blob && typeof blob.size === 'number' && blob.size > 0 && shaCacheBytes + blob.size <= SHA_CACHE_LIMIT) {
              const key = 'f' + idx;
              if (!shaCache.has(key)) {
                shaCache.set(key, buf);
                shaCacheBytes += blob.size;
              }
            }
            resolve(sha256Bytes(new Uint8Array(buf)));
          }
          catch (e) { reject(e); }
        };
        reader.readAsArrayBuffer(blob);
      });
    }
    function sha256Bytes(bytes) {
      const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
      const l = bytes.length, bitLen = l * 8;
      const withPad = Math.ceil((l + 9) / 64) * 64;
      const padded = new Uint8Array(withPad);
      padded.set(bytes);
      padded[l] = 0x80;
      const dv = new DataView(padded.buffer);
      dv.setUint32(withPad - 8, Math.floor(bitLen / 0x100000000), false);
      dv.setUint32(withPad - 4, bitLen >>> 0, false);
      const w = new Int32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let off = 0; off < withPad; off += 64) {
        for (let i = 0; i < 16; i++) w[i] = dv.getInt32(off + i * 4, false);
        for (let i = 16; i < 64; i++) {
          const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15]>>>3);
          const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2]>>>10);
          w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
        }
        let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
        for (let i = 0; i < 64; i++) {
          const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
          const ch = (e & f) ^ ((~e) & g);
          const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
          const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) | 0;
          h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
        }
        h0=(h0+a)|0; h1=(h1+b)|0; h2=(h2+c)|0; h3=(h3+d)|0; h4=(h4+e)|0; h5=(h5+f)|0; h6=(h6+g)|0; h7=(h7+h)|0;
      }
      return [h0,h1,h2,h3,h4,h5,h6,h7].map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
    }

    function handleFiles(files) {
      for (let f of files) {
        if (!selectedFiles.some(x => x.name === f.name && x.size === f.size)) selectedFiles.push(f);
      }
      renderFileList();
    }

    function renderFileList() {
      const container = document.getElementById('fileTable');
      container.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const row = document.createElement('div');
        row.className = 'file-item flex items-center gap-3 bg-zinc-900 p-3 sm:p-4 rounded-2xl';
        const size = file.size >= 1048576 ? (file.size/1048576).toFixed(1)+' MB' : (file.size/1024).toFixed(1)+' KB';
        row.innerHTML = `
          <i class="fa-solid fa-file text-xl sm:text-2xl text-zinc-400 shrink-0"></i>
          <div class="min-w-0 flex-1">
            <div class="font-medium text-sm sm:text-base truncate">${escapeHtml(file.name)}</div>
            <div class="text-xs text-zinc-500">${size}</div>
          </div>
          <button type="button" onclick="removeFile(${index})" class="tap shrink-0 min-h-[44px] min-w-[44px] text-red-400 active:text-red-300 flex items-center justify-center">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>`;
        container.appendChild(row);
      });
      document.getElementById('fileList').classList.toggle('hidden', selectedFiles.length === 0);
      document.getElementById('uploadButton').classList.toggle('hidden', selectedFiles.length === 0);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function removeFile(index) { selectedFiles.splice(index, 1); renderFileList(); }
    function clearAll() {
      if (confirm('确定清空所有文件？')) { selectedFiles = []; renderFileList(); }
    }

    function fmtBytes(n){
      n=Number(n)||0;
      if(n<1024) return n+' B';
      if(n<1048576) return (n/1024).toFixed(1)+' KB';
      if(n<1073741824) return (n/1048576).toFixed(1)+' MB';
      return (n/1073741824).toFixed(2)+' GB';
    }
    function fmtEta(sec){
      sec=Math.max(0, Math.round(sec||0));
      if(sec<60) return sec+' 秒';
      const m=Math.floor(sec/60), s=sec%60;
      if(m<60) return m+' 分 '+s+' 秒';
      return Math.floor(m/60)+' 时 '+(m%60)+' 分';
    }
    function setProgress(pct, label, loaded, total, speed){
      const wrap=document.getElementById('progressWrap');
      wrap.classList.remove('hidden');
      pct=Math.max(0, Math.min(100, pct||0));
      document.getElementById('progressBar').style.width=pct.toFixed(1)+'%';
      document.getElementById('progressPct').textContent=pct.toFixed(1)+'%';
      if(label) document.getElementById('progressLabel').textContent=label;
      if(total!=null) document.getElementById('progressBytes').textContent=fmtBytes(loaded||0)+' / '+fmtBytes(total);
      document.getElementById('progressSpeed').textContent=speed||'';
    }

    // 大文件走服务器中转上传（绕过浏览器→云盘直传可能被网络损坏的路径）
    // 中转 = 浏览器 → NAS → 云盘，NAS→云盘这条路径已验证 100% 可靠
    function uploadViaProxy(expireHours, maxExt, totalSize) {
      return new Promise((resolve, reject) => {
        const formData = new FormData();
        for (const f of selectedFiles) formData.append('files', f, f.name);
        if (expireHours) formData.append('expire_hours', String(expireHours));
        if (maxExt) formData.append('max_extracts', String(maxExt));
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload');
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && totalSize > 0) {
            const pct = (e.loaded / totalSize) * 100;
            setProgress(pct, '上传中（服务器中转，比直传稍慢）…', e.loaded, totalSize, '');
          }
        };
        xhr.onload = () => {
          try {
            const r = JSON.parse(xhr.responseText);
            if (r && r.error) reject(new Error(r.error));
            else resolve(r);
          } catch (err) { reject(err); }
        };
        xhr.onerror = () => reject(new Error('网络错误，请重试'));
        xhr.send(formData);
      });
    }

    async function uploadFiles() {
      if (selectedFiles.length === 0) return;
      shaCache.clear(); shaCacheBytes = 0; // 每次上传重新读取并锁定内容
      const btn = document.getElementById('btnUpload');
      const oldHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 准备中…';
      const totalSize = selectedFiles.reduce((s,f)=>s+(f.size||0),0);

      let expireHours;
      {
        let val = parseFloat(document.getElementById('expireValue').value);
        if (!val || val < 1) val = 1;
        const unit = document.getElementById('expireUnit').value;
        expireHours = unit === 'day' ? val * 24 : val;
        const maxDays = Number(document.getElementById('maxExpireHint').textContent) || 90;
        if (expireHours > maxDays * 24) { alert('有效期不能超过 ' + maxDays + ' 天'); return; }
      }
      let maxExt = parseInt(document.getElementById('maxExtracts').value, 10);
      if (isNaN(maxExt) || maxExt < 0) maxExt = 0;

      // 大文件（>10MB）走服务器中转，绕开直传损坏路径
      if (totalSize > 10 * 1024 * 1024) {
        setProgress(0, '开始上传（服务器中转）…', 0, totalSize, '');
        try {
          const r = await uploadViaProxy(expireHours, maxExt, totalSize);
          selectedFiles = [];
          shaCache.clear(); shaCacheBytes = 0;
          showResult(r);
        } catch (err) {
          alert('上传失败：' + (err && err.message ? err.message : err));
        } finally {
          btn.disabled = false; btn.innerHTML = oldHtml;
          document.getElementById('progressWrap').classList.add('hidden');
        }
        return;
      }

      setProgress(0, '正在计算文件校验值…', 0, totalSize, '');

      let initData = null;
      try {
        // 1) 逐个计算 SHA256（纯 JS，主线程）
        const filesMeta = [];
        for (let fi = 0; fi < selectedFiles.length; fi++) {
          const f = selectedFiles[fi];
          setProgress(0, '正在计算 ' + f.name + ' 的校验值…', 0, totalSize, '大文件可能需要一些时间');
          const sha = await sha256Hex(f, fi);
          filesMeta.push({ name: f.name, size: f.size, sha256: sha, content_type: f.type || 'application/octet-stream' });
        }

        // 2) 创建上传任务（服务器在云盘建任务，返回预签名分片 URL）
        setProgress(0, '正在创建上传任务…', 0, totalSize, '');
        const initResp = await fetch('/api/direct-upload/init', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ title: '', expire_hours: expireHours, max_extracts: maxExt, files: filesMeta })
        });
        initData = await initResp.json().catch(() => ({}));
        if (!initResp.ok || initData.error) {
          throw new Error(initData.error || ('创建上传任务失败 HTTP ' + initResp.status));
        }

        // 3) 浏览器直传云盘：逐个分片 PUT 到预签名 URL
        let uploaded = 0, lastLoaded = 0, lastTs = Date.now();
        for (const fm of initData.files) {
          if (fm.exist || fm.rapid) { uploaded += fm.size; continue; } // 秒传/急速上传命中，无需上传
          const file = selectedFiles.find(x => x.name === fm.name && x.size === fm.size);
          if (!file) throw new Error('找不到本地文件：' + fm.name);
          const parts = fm.parts || [];
          const idx = initData.files.indexOf(fm);
          const cachedBuf = idx >= 0 ? shaCache.get('f' + idx) : undefined;
          for (let i = 0; i < parts.length; i++) {
            const part = parts[i];
            const start = (part.partNumber - 1) * part.partSize;
            const end = Math.min(start + part.partSize, file.size);
            let body;
            if (cachedBuf) {
              // 用 sha 计算时锁定在内存的同一份数据，杜绝文件被修改导致的不一致
              body = new Blob([new Uint8Array(cachedBuf, start, end - start)]);
            } else {
              body = file.slice(start, end);
            }
            const putResp = await fetch(part.uploadUrl, {
              method: 'PUT',
              headers: {'Content-Type': 'application/octet-stream'},
              body: body
            });
            if (!putResp.ok) throw new Error(fm.name + ' 分片 ' + part.partNumber + ' 上传失败（HTTP ' + putResp.status + '）');
            uploaded += end - start;
            const now = Date.now();
            const dt = Math.max(1, now - lastTs) / 1000;
            const speed = (uploaded - lastLoaded) / dt;
            lastLoaded = uploaded; lastTs = now;
            const pct = totalSize ? (uploaded / totalSize * 100) : 0;
            const remain = speed > 0 ? (totalSize - uploaded) / speed : 0;
            setProgress(pct, '直传云盘：' + fm.name + '（分片 ' + part.partNumber + '/' + parts.length + '）',
                        uploaded, totalSize, fmtBytes(speed) + '/s' + (remain > 0 && pct < 99.5 ? ' · 剩余 ' + fmtEta(remain) : ''));
          }
        }

        // 4) 完成：服务器通知云盘合并分片并登记
        setProgress(100, '正在完成上传…', totalSize, totalSize, '');
        const compResp = await fetch('/api/direct-upload/complete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            package_id: initData.package_id,
            files: (initData.files || []).map(f => ({
              name: f.name, size: f.size, sha256: f.sha256, content_type: f.content_type,
              file_id: f.file_id, upload_id: f.upload_id, file_name: f.file_name, exist: f.exist, rapid: f.rapid
            }))
          })
        });
        const compData = await compResp.json().catch(() => ({}));
        if (!compResp.ok || compData.error) {
          throw new Error(compData.error || ('完成上传失败 HTTP ' + compResp.status));
        }
        selectedFiles = [];
        shaCache.clear(); shaCacheBytes = 0;
        showResult(compData);
      } catch (err) {
        // 清理已创建但未完成的任务
        try {
          if (initData && initData.package_id) {
            await fetch('/api/direct-upload/cancel', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                package_id: initData.package_id,
                files: (initData.files || []).map(f => ({ file_id: f.file_id }))
              })
            });
          }
        } catch (e) {}
        shaCache.clear(); shaCacheBytes = 0;
        alert('上传失败：' + (err && err.message ? err.message : err));
        btn.disabled = false; btn.innerHTML = oldHtml;
        document.getElementById('progressWrap').classList.add('hidden');
      }
    }

    function showResult(data) {
      document.getElementById('uploadZone').classList.add('hidden');
      document.getElementById('fileList').classList.add('hidden');
      document.getElementById('uploadButton').classList.add('hidden');
      document.getElementById('resultPanel').classList.remove('hidden');
      document.getElementById('extractCode').textContent = data.extract_code;
      const hours = Number(data.expire_hours) || 0;
      let expireLabel = '';
      if (hours >= 24 && hours % 24 === 0) expireLabel = `${hours / 24} 天后`;
      else if (hours >= 24) {
        const d = Math.floor(hours / 24), h = Math.round(hours % 24);
        expireLabel = h ? `${d} 天 ${h} 小时后` : `${d} 天后`;
      } else expireLabel = `${Math.round(hours)} 小时后`;
      const expAt = data.expire_at ? new Date(data.expire_at * 1000).toLocaleString() : '';
      document.getElementById('expireTime').innerHTML =
        `<span class="text-violet-400">${expireLabel}</span> 过期` +
        (expAt ? `<div class="text-xs text-zinc-500 mt-1">${expAt}</div>` : '');
      document.getElementById('fileCount').textContent = `${data.file_count} 个文件`;
      const maxE = Number(data.max_extracts) || 0;
      document.getElementById('extractLimit').textContent = maxE > 0 ? `限 ${maxE} 次（用尽自动销毁）` : '不限次数';

      let linkBox = document.getElementById('extractLinkBox');
      if (!linkBox) {
        linkBox = document.createElement('div');
        linkBox.id = 'extractLinkBox';
        linkBox.className = 'mt-4 text-sm break-all text-zinc-400';
        document.getElementById('resultPanel').insertBefore(
          linkBox, document.getElementById('resultPanel').querySelector('button')
        );
      }
      const url = data.extract_url || (`/extract?code=${data.extract_code}`);
      linkBox.innerHTML = `提取页：<a class="text-violet-400 underline" href="${url}">${url}</a>`;
    }

    function copyCode() {
      const code = document.getElementById('extractCode').textContent;
      const done = () => {
        const t = document.createElement('div');
        t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-sm px-4 py-2 rounded-full z-50';
        t.textContent = '提取码已复制';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
      } else fallbackCopy(code, done);
    }
    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) { alert(text); }
      ta.remove();
    }

    const zone = document.getElementById('uploadZone');
    zone.addEventListener('click', e => {
      if (e.target.closest('button') || e.target.closest('input')) return;
      document.getElementById('fileInput').click();
    });
    ;['dragenter','dragover'].forEach(ev => {
      zone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); zone.classList.add('dragover'); });
    });
    ;['dragleave','drop'].forEach(ev => {
      zone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); zone.classList.remove('dragover'); });
    });
    zone.addEventListener('drop', e => { handleFiles(e.dataTransfer.files); });
  </script>
</body>
</html>
