services:
  file-transfer:
    build:
      context: .
      dockerfile: Dockerfile
    image: file-transfer-system:latest
    container_name: file-transfer-system
    restart: unless-stopped
    # 不对外发布端口：宿主机 8790 已被 fts-tls（TLS 反代）占用，访问链路是
    # nginx → 容器IP:8790（容器网络内部直连），应用容器无需朝外开门。
    # 若在这里声明 ports，compose up 会报 "port is already allocated" 直接失败。
    # ports:
    #   - "${FTS_PORT:-8790}:8790"
    environment:
      FTS_HOST: "0.0.0.0"
      FTS_PORT: "8790"
      TZ: Asia/Shanghai
      # 可选：首次启动后仍建议在后台改密；仅作初始化提示
      # PUBLIC_BASE_URL 可在后台 site.public_base_url 配置
    volumes:
      # 配置 + SQLite
      - ./data:/app/data
      # 本地上传文件（云盘直传完善前仍会用到）
      - ./storage:/app/storage
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
